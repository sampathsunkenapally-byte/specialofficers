<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#1b2433;--mu:#5b6677;--bd:#d3d9e3;--nv:#14325e;--nv2:#1f4a8a;--sf:#e8872b;--gr:#1e8a4c;--grb:#dff3e7;--am:#a96a00;--amb:#fff0cf;--rd:#c0392b;--rdb:#fbe0dc;--hd:#e9eef7;--cal:#eef1f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151e;--card:#1a2230;--tx:#e6ebf3;--mu:#98a3b5;--bd:#2f3b50;--nv:#0d2447;--nv2:#6fa3f0;--grb:#14392a;--amb:#40320f;--rdb:#451d19;--hd:#222d42;--cal:#232d40;--gr:#4cc482;--am:#e6b04a;--rd:#ef7a6d}}
:root[data-theme=dark]{--bg:#10151e;--card:#1a2230;--tx:#e6ebf3;--mu:#98a3b5;--bd:#2f3b50;--nv:#0d2447;--nv2:#6fa3f0;--grb:#14392a;--amb:#40320f;--rdb:#451d19;--hd:#222d42;--cal:#232d40;--gr:#4cc482;--am:#e6b04a;--rd:#ef7a6d}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",Arial,Helvetica,sans-serif}
.strip{height:5px;background:linear-gradient(90deg,#e8872b 33%,#fff 33% 66%,#1e8a4c 66%)}
header.top{background:var(--nv);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top h1{font:700 20px Georgia,serif;margin:0}header.top small{opacity:.8;display:block}
header.top .sp{flex:1}header.top input{padding:6px 8px;border-radius:4px;border:1px solid #fff5;background:#fff2;color:#fff;width:150px}
header.top input::placeholder{color:#fffb}
nav{background:var(--card);border-bottom:2px solid var(--nv2);display:flex;gap:2px;padding:0 14px;flex-wrap:wrap}
nav button{border:0;background:none;padding:11px 16px;font:600 14px inherit;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--nv2);border-color:var(--sf)}
main{padding:16px 20px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.card h2{font:700 16px Georgia,serif;margin:0 0 10px;color:var(--nv2);border-left:4px solid var(--sf);padding-left:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--nv2);border-radius:6px;padding:10px 14px}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mu);font-size:12px}
.kpi.g{border-top-color:var(--gr)}.kpi.a{border-top-color:var(--am)}.kpi.r{border-top-color:var(--rd)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--hd);font-size:12px}td.n{text-align:right;font-variant-numeric:tabular-nums}
td.c{background:var(--cal)}
.p{display:inline-block;padding:1px 8px;border-radius:10px;font-weight:600;font-size:12px}
.good{background:var(--grb);color:var(--gr)}.avg{background:var(--amb);color:var(--am)}.poor{background:var(--rdb);color:var(--rd)}.na{background:var(--hd);color:var(--mu)}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0}.bar i{width:150px;font-style:normal;font-size:12px;flex:none}
.bar .t{flex:1;background:var(--hd);height:16px;border-radius:3px;overflow:hidden}.bar .t u{display:block;height:100%}
.bar em{width:96px;font-style:normal;font-size:12px;flex:none}
.g{background:var(--gr)}.a{background:var(--am)}.r{background:var(--rd)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
select,input,button.b{font:inherit;padding:6px 9px;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--tx)}
button.b{background:var(--nv2);color:#fff;border-color:var(--nv2);cursor:pointer;font-weight:600}
button.b.s{background:var(--card);color:var(--nv2)}button.b.d{background:var(--rd);border-color:var(--rd)}button.b.x{padding:3px 8px;font-size:12px}
td input{width:100%;min-width:70px;padding:3px 5px}.hm td{text-align:center;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{padding:6px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;cursor:pointer}
.tabs button.on{background:var(--nv2);color:#fff;border-color:var(--nv2)}
.rep{background:#fff;color:#111;border:1px solid var(--bd);padding:18px;--bd:#bbb;--hd:#e9eef7;--cal:#f1f3f7;--tx:#111;--mu:#555;--grb:#dff3e7;--gr:#1e7a44;--amb:#fff0cf;--am:#8a5600;--rdb:#fbe0dc;--rd:#b03024}
.rep h3{font:700 13px Georgia,serif;background:var(--nv);color:#fff;padding:4px 8px;margin:12px 0 4px}.rep h4{margin:8px 0 3px;font-size:12px}
.rh{text-align:center;border-bottom:3px double #14325e;padding-bottom:6px;margin-bottom:8px}.rh b{display:block;font:700 15px Georgia,serif;color:#14325e}
.rep table{font-size:11px}.rep th,.rep td{padding:3px 5px}.rep .ft{margin-top:10px;font-size:10px;color:#555;border-top:1px solid #999;padding-top:4px;display:flex;justify-content:space-between}
.note{color:var(--mu);font-size:12px}

.steps{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.sp2{flex:1}
.pills button{font-size:13px;padding:5px 12px;border-radius:4px}
.msg{background:var(--grb);color:var(--gr);border:1px solid var(--gr);padding:7px 10px;border-radius:4px;margin-bottom:10px;font-weight:600}
.eg th{white-space:normal;min-width:92px;text-align:center;vertical-align:middle}.eg th.ch{background:var(--cal)}
.eg td{padding:4px 6px;vertical-align:middle}.eg td.mn{font-weight:700;white-space:nowrap}
.eg th:nth-child(2),.eg td:nth-child(2){position:sticky;left:0;background:var(--hd);z-index:1}.eg td:nth-child(2){background:var(--card)}
.eg tfoot td{background:var(--hd);font-weight:700}.eg tfoot td:nth-child(2){background:var(--hd)}
.eg input{width:100%;min-width:84px;text-align:right;padding:5px 6px}.eg input[type=text]{text-align:left}
.eg input.chg{background:#fff3b0;color:#222;border-color:var(--am)}.eg input.bad{border-color:var(--rd);background:var(--rdb)}
.eg tbody tr:hover td:not(.c){background:var(--hd)}
.sbar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--nv);color:#fff;padding:10px 16px;border-radius:6px;box-shadow:0 -2px 10px #0004;margin-bottom:8px}
.sbar b{color:#fff}.sbar button.b{background:#fff;color:var(--nv);border-color:#fff}.sbar button.b.s{background:transparent;color:#fff;border-color:#fffa}.sbar button.b.d{background:var(--rd);color:#fff;border-color:var(--rd)}
#printArea{display:none}
@media print{
:root,:root[data-theme=dark]{--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#999;--hd:#e9eef7;--cal:#f1f3f7;--nv:#14325e;--nv2:#14325e;--grb:#dff3e7;--gr:#1e7a44;--amb:#fff0cf;--am:#8a5600;--rdb:#fbe0dc;--rd:#b03024;padding:0}
@page{size:A4 portrait;margin:12mm}
body{background:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.app{display:none!important}#printArea{display:block}
.rep{border:0;padding:0;page-break-after:always}.rep:last-child{page-break-after:auto}
.rep h3,.card h2{break-after:avoid}.rep table{break-inside:auto}tr{break-inside:avoid}.card,.kpi{break-inside:avoid;border-color:#999}

function latestRows(ti){const mx={};T[ti].rows.forEach(r=>{if(asOn&&rd(r)>asOn)return;const k=r.v['Mandal']+'|'+r.v['Item / Category'];if(!(k in mx)||rd(r)>=rd(mx[k]))mx[k]=r});return Object.values(mx)}
function comp(ti,r){const o={...r.v},s=S[ti];for(const c in s.calc)o[c]=s.calc[c](o);for(const c in s.pct)o[c]=pc(g(o,s.pct[c][0]),g(o,s.pct[c][1]));return o}
function tot(ti,rows){const o={},s=S[ti];rows.forEach(r=>{const c=comp(ti,r);T[ti].cols.forEach(k=>{if(typeof c[k]=='number'&&!(k in s.pct)&&k!='S.No')o[k]=(o[k]||0)+c[k]})});for(const c in s.pct)o[c]=pc(g(o,s.pct[c][0]),g(o,s.pct[c][1]));return o}
function score(m,subj){let n=0,d=0;T.forEach((t,ti)=>{if(subj&&t.subject!=subj)return;latestRows(ti).forEach(r=>{if(r.v['Mandal']!=m||!hasData(ti,r))return;const c=comp(ti,r),a=g(c,S[ti].m[0]),b=g(c,S[ti].m[1]);if(b>0){n+=Math.min(a,b);d+=b}})});return d?R1(n/d*100):null}
function overall(m){const a=SUBJ.map(s=>score(m,s)).filter(x=>x!==null);return a.length?R1(a.reduce((x,y)=>x+y)/a.length):null}
const rate=p=>p===null?['na','No data','']:p>=75?['good','Good','g']:p>=50?['avg','Average','a']:['poor','Poor','r'];
const pill=p=>{const r=rate(p);return `<span class="p ${r[0]}">${p===null?'—':p+'%'} ${p===null?'':r[1]}</span>`};
const fmt=(v,c)=>typeof v=='number'?(/^%/.test(c)?v+'%':v.toLocaleString('en-IN')):esc(v);
const subm=(m,ti)=>{const rs=latestRows(ti).filter(r=>r.v['Mandal']==m&&hasData(ti,r));return rs.length?rs.map(rd).sort().pop():null};
const fd=d=>d?d.split('-').reverse().join('.'):'—';
function bars(list){return list.map(([n,p])=>{const r=rate(p);return `<div class="bar"><i>${esc(n)}</i><div class="t"><u class="${r[2]}" style="width:${Math.min(p||0,100)}%"></u></div><em>${pill(p)}</em></div>`}).join('')}
/* ---------- District ---------- */
let dsub=SUBJ[0];
function distHTML(print){
 const ov=M.map(m=>[m,overall(m)]),sc=ov.filter(x=>x[1]!==null),G=sc.filter(x=>x[1]>=75).length,P=sc.filter(x=>x[1]<50).length;
 const done=T.reduce((a,t,ti)=>a+M.filter(m=>subm(m,ti)).length,0),all=T.length*M.length;
 const ds=M.map(m=>[m,score(m,dsub)]).sort((a,b)=>(b[1]??-1)-(a[1]??-1)),dv=ds.filter(x=>x[1]!==null);
 let h=`<div class="rh"><b>DISTRICT REVIEW DASHBOARD — ALL MANDALS</b>Karimnagar District · As on ${fd(asOn||DEF)}</div>
 <div class="kpis"><div class="kpi"><b>${M.length}</b><span>Mandals monitored</span></div><div class="kpi"><b>${Math.round(done/all*100)}%</b><span>Data entry complete (${done}/${all} mandal-tables)</span></div>
 <div class="kpi g"><b>${G}</b><span>Mandals rated Good (≥75%)</span></div><div class="kpi a"><b>${sc.length-G-P}</b><span>Average (50–75%)</span></div><div class="kpi r"><b>${P}</b><span>Poor (&lt;50%) – need review</span></div></div>
 <div class="card"><h2>Overall Mandal Ranking (average of subject scores)</h2>${bars(ov.slice().sort((a,b)=>(b[1]??-1)-(a[1]??-1)))}</div>
 <div class="card"><h2>Mandal × Subject Performance Matrix</h2><div class="tw"><table class="hm"><tr><th>Mandal</th>${SUBJ.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Overall</th></tr>
 ${M.map(m=>`<tr><td style="text-align:left">${esc(m)}</td>${SUBJ.concat(['']).map(s=>{const p=s?score(m,s):overall(m);return `<td class="${rate(p)[0]}">${p===null?'—':p+'%'}</td>`}).join('')}</tr>`).join('')}</table></div>
 <p class="note">Score = work achieved ÷ target/sanctioned (latest figures). Good ≥ 75% · Average 50–75% · Poor &lt; 50%.</p></div>
 <div class="card"><h2>Subject-wise Review — ${print?esc(dsub):`<select id="dsub">${SUBJ.map(s=>`<option ${s==dsub?'selected':''}>${esc(s)}</option>`).join('')}</select>`}</h2>
 <div class="two"><div><b style="color:var(--gr)">▲ Good performing (top 5)</b>${bars(dv.slice(0,5))}</div><div><b style="color:var(--rd)">▼ Needs attention (bottom 5)</b>${bars(dv.slice(-5).reverse())}</div></div></div>
 <div class="card"><h2>Data Submission Status (latest entry date per table)</h2><div class="tw"><table><tr><th>Mandal</th>${T.map(t=>`<th title="${esc(t.title)}">${esc(t.title.split(/[ .]/)[0])}<br><small>${esc(t.subject)}</small></th>`).join('')}</tr>
 ${M.map(m=>`<tr><td>${esc(m)}</td>${T.map((t,ti)=>{const d=subm(m,ti);return `<td class="${d?'good':'poor'}">${d?'✓ '+fd(d).slice(0,5):'✗ Pending'}</td>`}).join('')}</tr>`).join('')}</table></div></div>`;
 T.forEach((t,ti)=>{const items=[...new Set(t.rows.map(r=>r.v['Item / Category']))],cols=t.cols.filter(c=>!/^(Mandal|S\.No|Item.*|Remarks|issues|Issues|Check)$/.test(c));
  h+=`<div class="card"><h2>${esc(t.subject)} — ${esc(t.title)} · District Totals</h2><div class="tw"><table><tr><th>Item / Category</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
  ${items.map(i=>{const o=tot(ti,latestRows(ti).filter(r=>r.v['Item / Category']==i));return `<tr><td>${esc(i)}</td>${cols.map(c=>`<td class="n ${isCalc(ti,c)?'c':''}">${c in o?fmt(o[c],c):''}</td>`).join('')}</tr>`}).join('')}</table></div></div>`});
 return h}
/* ---------- Mandal profile ---------- */
let pm=M[0];
function repHTML(m){
 const o=overall(m);let low=[];
 let h=`<section class="rep"><div class="rh"><b>MANDAL PROFILE REPORT — ${esc(m)}</b>Rural Development Review · Karimnagar District · As on ${fd(asOn||DEF)}</div>
 <table><tr><th>Overall score</th><td>${pill(o)}</td><th>Tables with data</th><td>${T.filter((t,ti)=>subm(m,ti)).length} of ${T.length}</td></tr>
 <tr>${SUBJ.map(s=>`<th>${esc(s)}</th>`).join('')}</tr><tr>${SUBJ.map(s=>`<td>${pill(score(m,s))}</td>`).join('')}</tr></table>`;
 SUBJ.forEach(s=>{h+=`<h3>${esc(s)} — ${score(m,s)===null?'No data':score(m,s)+'% ('+rate(score(m,s))[1]+')'}</h3>`;
  T.forEach((t,ti)=>{if(t.subject!=s)return;const cols=t.cols.filter(c=>!/^(Mandal|S\.No)$/.test(c)),rs=latestRows(ti).filter(r=>r.v['Mandal']==m);
   h+=`<h4>${esc(t.title)}</h4><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Date</th></tr>`+rs.map(r=>{const c=comp(ti,r);if(hasData(ti,r)){const p=pc(g(c,S[ti].m[0]),g(c,S[ti].m[1]));if(g(c,S[ti].m[1])>0)low.push([p,c['Item / Category'],s])}
    return `<tr>${cols.map(k=>`<td class="${typeof c[k]=='number'?'n':''} ${isCalc(ti,k)?'c':''}">${fmt(c[k],k)}</td>`).join('')}<td>${fd(rd(r))}</td></tr>`}).join('')+'</table>'})});
 low.sort((a,b)=>a[0]-b[0]);
 h+=`<h3>Key Observations for Review</h3><table><tr><th>Subject</th><th>Item (lowest progress)</th><th>Progress</th></tr>${low.slice(0,5).map(x=>`<tr><td>${esc(x[2])}</td><td>${esc(x[1])}</td><td>${pill(x[0])}</td></tr>`).join('')||'<tr><td colspan=3>No data entered</td></tr>'}</table>
 <div class="ft"><span>Generated ${new Date().toLocaleString('en-IN')}</span><span>Mandal-wise Review Monitoring System</span><span>Signature of MPDO / Officer: ____________</span></div></section>`;return h}
function pdf(html){$('#printArea').innerHTML=html;setTimeout(()=>window.print(),150)}
/* ---------- Entry ---------- */
let ev={s:SUBJ[0],t:0,i:'',d:'',edit:false,draft:{},del:false,msg:''};
const NOIN=/^(Mandal|S\.No|Item \/ Category)$/;
function ectx(){const ts=T.map((t,i)=>i).filter(i=>T[i].subject==ev.s);if(!ts.includes(ev.t))ev.t=ts[0];const ti=ev.t,t=T[ti];
 const items=[...new Set(t.rows.map(r=>r.v['Item / Category']))];if(!items.includes(ev.i))ev.i=items[0];
 const dates=[...new Set(t.rows.map(rd))].sort().reverse();if(!dates.includes(ev.d))ev.d=dates[0]||DEF;return{ts,ti,t,items,dates}}
const findRow=(ti,m)=>T[ti].rows.find(r=>r.v['Mandal']==m&&r.v['Item / Category']==ev.i&&rd(r)==ev.d);
const curVals=(ti,m)=>{const r=findRow(ti,m);return{...(r?r.v:{'Mandal':m,'Item / Category':ev.i}),...(ev.draft[m]||{})}};
const nChg=()=>Object.values(ev.draft).reduce((a,o)=>a+Object.keys(o).length,0);
function entryHTML(){
 const{ts,ti,t,items,dates}=ectx(),cols=t.cols.filter(c=>!NOIN.test(c));
 let h=`<div class="card"><h2>Data Entry — Mandal-wise Table</h2>
 <div class="tabs">${SUBJ.map(s=>`<button class="${s==ev.s?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
 <div class="steps"><b>Table:</b> <select id="ft">${ts.map(i=>`<option value="${i}" ${i==ti?'selected':''}>${esc(T[i].title)}</option>`).join('')}</select>
 <b>Report date:</b> <select id="fd">${dates.map(d=>`<option value="${d}" ${d==ev.d?'selected':''}>${fd(d)}</option>`).join('')}</select>
 <span class="sp2"></span><input type="date" id="nd" value="${asOn||DEF}"><button class="b s x" id="mk">+ New date</button></div>
 <div class="tabs pills">${items.map(i=>`<button class="${i==ev.i?'on':''}" data-i="${esc(i)}">${esc(i)}</button>`).join('')}</div>
 ${ev.msg?`<div class="msg">${esc(ev.msg)}</div>`:''}
 <div class="tw eg-w"><table class="eg"><thead><tr><th>S.No</th><th>Mandal</th><th>Status</th>${cols.map(c=>`<th class="${isCalc(ti,c)?'ch':''}">${esc(c)}${isCalc(ti,c)?'<br><small>(auto)</small>':''}</th>`).join('')}</tr></thead><tbody>`;
 M.forEach((m,x)=>{const v=curVals(ti,m),c=comp(ti,{v}),r=findRow(ti,m),ok=r&&hasData(ti,r);
  h+=`<tr data-m="${esc(m)}"><td>${x+1}</td><td class="mn">${esc(m)}</td><td>${ok?'<span class="p good">✓ Entered</span>':'<span class="p poor">Pending</span>'}</td>`+cols.map(k=>{
   if(isCalc(ti,k))return `<td class="n c" data-c="${esc(k)}">${fmt(c[k],k)}</td>`;
   if(ev.edit){const dv=ev.draft[m]&&k in ev.draft[m];return `<td><input class="${dv?'chg':''}" data-m="${esc(m)}" data-k="${esc(k)}" ${isTxt(k)?'type="text" style="min-width:150px"':'type="number" min="0" step="any"'} value="${esc(v[k])}"></td>`}
   return `<td class="${typeof v[k]=='number'?'n':''}">${v[k]==null?'<span class="note">–</span>':fmt(v[k],k)}</td>`}).join('')+'</tr>'});
 const o=tot(ti,M.map(m=>({v:curVals(ti,m)})));
 h+=`</tbody><tfoot><tr><td></td><td class="mn">DISTRICT TOTAL</td><td></td>${cols.map(k=>`<td class="n" data-tc="${esc(k)}">${k in o?fmt(o[k],k):''}</td>`).join('')}</tr></tfoot></table></div>
 <p class="note">${ev.edit?'Type directly in the cells · press Enter to move down · Tab to move across · grey columns calculate automatically.':'Click “Edit data” below to enter or change figures for this table and date.'}</p></div>
 <div class="sbar"><span>${esc(ev.s)} › ${esc(t.title)} › <b>${esc(ev.i)}</b> › ${fd(ev.d)} ${ev.edit?`· <b id="cnt" style="color:var(--am)">${nChg()} change(s)</b>`:''}</span><span class="sp2"></span>
 ${ev.edit?`<button class="b" id="up">✔ Update</button><button class="b s" id="cx">✖ Cancel</button>`:`<button class="b" id="ed">✎ Edit data</button><button class="b ${ev.del?'d':'s'}" id="dl">${ev.del?'Confirm delete?':'🗑 Delete this date'}</button>`}</div>`;return h}
function refreshCalc(){const{ti}=ectx();document.querySelectorAll('#main tbody tr').forEach(tr=>{const c=comp(ti,{v:curVals(ti,tr.dataset.m)});tr.querySelectorAll('[data-c]').forEach(td=>td.textContent=fmt(c[td.dataset.c],td.dataset.c))});
 const o=tot(ti,M.map(m=>({v:curVals(ti,m)})));document.querySelectorAll('[data-tc]').forEach(td=>{const k=td.dataset.tc;td.textContent=k in o?fmt(o[k],k):''});const n=$('#cnt');if(n)n.textContent=nChg()+' change(s)'}
function bindEntry(){const{ti,t}=ectx();
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ev.s=b.dataset.s;ev.edit=false;ev.draft={};ev.msg='';ev.i='';ev.d='';render()});
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ev.i=b.dataset.i;ev.edit=false;ev.draft={};ev.msg='';render()});
 $('#ft').onchange=e=>{ev.t=+e.target.value;ev.i='';ev.d='';ev.edit=false;ev.draft={};ev.msg='';render()};
 $('#fd').onchange=e=>{ev.d=e.target.value;ev.edit=false;ev.draft={};ev.msg='';render()};
 $('#mk').onclick=()=>{const d=$('#nd').value;if(!d)return;if(t.rows.some(r=>rd(r)==d)){ev.msg='Entries already exist for '+fd(d)+' — select that date from "Report date".';return render()}
  const L=latestRows(ti);L.forEach(r=>t.rows.push({id:newId(),d,v:{...r.v}}));log('NEW DATE','All','',d,`Created ${L.length} rows for ${fd(d)} (copied from latest figures)`);ev.d=d;ev.msg='New date '+fd(d)+' created with previous figures. Click Edit data to change them.';save();render()};
 if(ev.edit){
  document.querySelectorAll('#main input[data-k]').forEach(i=>{i.oninput=()=>{const m=i.dataset.m,k=i.dataset.k,r=findRow(ti,m),old=r?r.v[k]:null,nv=isTxt(k)?i.value:(i.value===''?null:+i.value);
    i.classList.toggle('bad',typeof nv=='number'&&nv<0);
    if((old??'')===(nv??'')){if(ev.draft[m]){delete ev.draft[m][k];if(!Object.keys(ev.draft[m]).length)delete ev.draft[m]}i.classList.remove('chg')}else{(ev.draft[m]=ev.draft[m]||{})[k]=nv;i.classList.add('chg')}refreshCalc()};
   i.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();const a=[...document.querySelectorAll(`#main input[data-k="${CSS.escape(i.dataset.k)}"]`)],n=a[a.indexOf(i)+1];if(n)n.focus()}}});
  $('#cx').onclick=()=>{ev.edit=false;ev.draft={};ev.msg='Changes discarded.';render()};
  $('#up').onclick=()=>{let bad=false,cnt=0;for(const m in ev.draft)for(const k in ev.draft[m])if(typeof ev.draft[m][k]=='number'&&ev.draft[m][k]<0)bad=true;
   if(bad){ev.msg='Negative numbers are not allowed — please correct the red cells.';return render()}
   for(const m in ev.draft){let r=findRow(ti,m);const ch=[];for(const k in ev.draft[m]){const o=r?r.v[k]:undefined,n=ev.draft[m][k];if((o??'')!==(n??'')){ch.push(`${k}: ${o??'–'} → ${n??'–'}`)}}
    if(!ch.length)continue;if(!r){r={id:newId(),d:ev.d,v:{'Mandal':m,'Item / Category':ev.i}};t.rows.push(r)}Object.assign(r.v,ev.draft[m]);cnt++;log('UPDATE',m,ev.i,ev.d,ch.join('; '))}
   ev.edit=false;ev.draft={};ev.msg=cnt?`Updated ${cnt} mandal(s) successfully. See Update Log for details.`:'No changes to update.';save();render()}}
 else{$('#ed').onclick=()=>{ev.edit=true;ev.del=false;ev.msg='';render()};
  $('#dl').onclick=()=>{if(!ev.del){ev.del=true;return render()}const n=t.rows.filter(r=>rd(r)==ev.d&&r.v['Item / Category']==ev.i).length;
   t.rows=t.rows.filter(r=>!(rd(r)==ev.d&&r.v['Item / Category']==ev.i));log('DELETE','All',ev.i,ev.d,`Deleted ${n} rows`);ev.del=false;ev.msg='Entries deleted for '+ev.i+' on '+fd(ev.d);save();render()}}}
function log(a,m,i,d,x){const t=T[ev.t];LOG.push({t:new Date().toISOString(),u:$('#user').value||'—',a,s:t.subject,tb:t.title,m,i,d,x})}
/* ---------- Logs ---------- */
let lf={m:'',s:''};
function logsHTML(){const L=LOG.filter(l=>(!lf.m||l.m==lf.m)&&(!lf.s||l.s==lf.s)).reverse().slice(0,500);
 return `<div class="card"><h2>Update Log — who changed what, when</h2><div class="bar2"><label>Mandal<select id="lm"><option value="">All</option>${M.map(m=>`<option ${m==lf.m?'selected':''}>${esc(m)}</option>`).join('')}</select></label>
 <label>Subject<select id="ls"><option value="">All</option>${SUBJ.map(m=>`<option ${m==lf.s?'selected':''}>${esc(m)}</option>`).join('')}</select></label>
 <button class="b s" id="bk">Download backup (JSON)</button><label>Restore backup<input type="file" id="rs" accept=".json"></label></div>
 <div class="tw"><table><tr><th>Date & time</th><th>By</th><th>Action</th><th>Subject / Table</th><th>Mandal</th><th>Item</th><th>Report date</th><th>Details</th></tr>
 ${L.map(l=>`<tr><td>${new Date(l.t).toLocaleString('en-IN')}</td><td>${esc(l.u)}</td><td><span class="p ${l.a=='DELETE'?'poor':l.a=='UPDATE'?'avg':'good'}">${l.a}</span></td><td>${esc(l.s)}<br><small>${esc(l.tb)}</small></td><td>${esc(l.m)}</td><td>${esc(l.i)}</td><td>${fd(l.d)}</td><td>${esc(l.x)}</td></tr>`).join('')||'<tr><td colspan=8>No changes logged yet.</td></tr>'}</table></div>
 <p class="note">${CLOUD?'Data and logs are saved in the shared cloud database. Download a backup regularly.':'Data and logs are stored in this browser. Use the backup to move data between devices.'}</p></div>`}
/* ---------- Shell ---------- */
const NAV=[['district','District Dashboard'],['mandal','Mandal Profile'],['entry','Data Entry'],['logs','Update Log']];
function render(){
 $('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${k==view?'on':''}" data-v="${k}">${n}</button>`).join('')+`<span style="flex:1"></span><button id="th">◐ Theme</button>`;
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 $('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark'};
 const m=$('#main');
 if(view=='district'){m.innerHTML=`<div class="bar2"><button class="b" id="pd">⬇ Download District Report (PDF, A4)</button></div>`+distHTML();$('#pd').onclick=()=>pdf(`<section class="rep">${distHTML(true)}</section>`);$('#dsub').onchange=e=>{dsub=e.target.value;render()}}
 if(view=='mandal'){m.innerHTML=`<div class="bar2"><label>Select Mandal<select id="pms">${M.map(x=>`<option ${x==pm?'selected':''}>${esc(x)}</option>`).join('')}</select></label><button class="b" id="p1">⬇ Download this Mandal (PDF, A4)</button><button class="b s" id="pa">⬇ All 15 Mandals (one PDF)</button></div>`+repHTML(pm);
  $('#pms').onchange=e=>{pm=e.target.value;render()};$('#p1').onclick=()=>pdf(repHTML(pm));$('#pa').onclick=()=>pdf(M.map(repHTML).join(''))}
 if(view=='entry'){if(CLOUD&&!SES){m.innerHTML=loginHTML();bindLogin()}else{m.innerHTML=entryHTML();bindEntry()}}
 if(view=='logs'){m.innerHTML=logsHTML();$('#lm').onchange=e=>{lf.m=e.target.value;render()};$('#ls').onchange=e=>{lf.s=e.target.value;render()};
  $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({T,LOG})],{type:'application/json'}));a.download='mandal_review_backup.json';a.click()};
  $('#rs').onchange=e=>{const f=e.target.files[0];if(!f)return;if(CLOUD&&!SES){alert('Please login first (Data Entry tab).');return}f.text().then(x=>{try{const o=JSON.parse(x);T=o.T;LOG=o.LOG||[];save();render()}catch(_){alert('Invalid backup file')}})}}
}
const ids=T.forEach(t=>t.rows.forEach(r=>{if(!r.id)r.id=++nid}));
const dates=T.flatMap(t=>t.rows.map(rd));asOn=dates.sort().pop()||DEF;
$('#asOn').value=asOn;$('#asOn').onchange=e=>{asOn=e.target.value;render()};
try{$('#user').value=localStorage.getItem(UK)||''}catch(e){}$('#user').onchange=e=>{try{localStorage.setItem(UK,e.target.value)}catch(_){}};
render();
if(CLOUD){sb=supabase.createClient(SB_URL,SB_KEY);let rt;
 const boot=async()=>{try{await loadCloud();setStatus('Connected to cloud')}catch(e){console.error(e);setStatus('⚠ Cloud load failed – showing offline copy')}
  asOn=T.flatMap(t=>t.rows.map(rd)).sort().pop()||DEF;$('#asOn').value=asOn;authUI();render();if(loaded&&SES&&!hadRows)sync()};
 sb.auth.getSession().then(({data})=>{SES=data.session;boot()});
 sb.auth.onAuthStateChange((_e,s)=>{SES=s;authUI();render();if(loaded&&SES&&!hadRows)sync()});
 sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(rt);rt=setTimeout(async()=>{if(ev.edit||syncing||!loaded)return;try{await loadCloud();render()}catch(e){}},1500)}).subscribe()}
</script></body></html>
